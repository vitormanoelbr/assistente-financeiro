name: Harness Financeiro

on:
  push:
    branches:
      - nova-arquitetura
  pull_request:
    branches:
      - main
      - nova-arquitetura

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Executar harness
        run: |
          python -m pytest -q
